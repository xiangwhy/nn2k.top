<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="nn2k.top">
  <rect width="1200" height="630" fill="#F1EEE7"/>

  <!-- 印章：左侧居中 -->
  <g transform="translate(220 175)">
    <rect width="280" height="280" fill="#B5302A" transform="rotate(-4 140 140)"/>
    <text
      x="140" y="140"
      fill="#F1EEE7"
      font-family="'Songti SC','Source Han Serif SC','IBM Plex Serif','Songti TC',serif"
      font-size="180"
      font-weight="500"
      text-anchor="middle"
      dominant-baseline="central"
      transform="rotate(-4 140 140)">翔</text>
    <rect
      x="-12" y="-12" width="304" height="304"
      fill="none"
      stroke="#B5302A"
      stroke-opacity="0.35"
      stroke-width="2"
      transform="rotate(-4 140 140)"/>
  </g>

  <!-- 站点名 -->
  <text
    x="600" y="280"
    fill="#1A1814"
    font-family="'IBM Plex Serif','Songti SC','Source Han Serif SC',serif"
    font-size="140"
    font-weight="500"
    letter-spacing="-3">nn2k.top</text>

  <!-- dotted rule -->
  <line
    x1="600" y1="335" x2="1120" y2="335"
    stroke="#D8D2C5"
    stroke-width="1.5"
    stroke-dasharray="2 6"/>

  <!-- 标语 -->
  <text
    x="600" y="410"
    fill="#6B6660"
    font-family="'IBM Plex Serif','Songti SC',serif"
    font-size="46"
    font-weight="400">做过的一些东西、几行字</text>
</svg>
